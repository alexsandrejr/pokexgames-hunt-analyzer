[package]
name = "pxg-app"
description = "Janela do PokeXGames Hunt Analyzer (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pxg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pxg-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = "0.4"
# Mesmas versões que o Tauri usa, para imprimir o PDF pelo WebView2.
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
# O `tauri dev` desliga os recursos padrão (--no-default-features) e usa o servidor do Vite;
# o binário de release embute as telas.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
